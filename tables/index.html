<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Explore DiskANN experiment results without server-side filtering.">
    <title>Tables · DiskANN Experiment Explorer</title>
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body class="tables-page">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="brand" href="../">Home</a>
      <div>
        <a href="../overview.html">Overview</a>
        <a class="is-current" href="./" aria-current="page">Tables</a>
        <a href="../diagrams.html">Diagrams</a>
        <a href="../geometry.html">Graph</a>
      </div>
    </nav>
    <main class="layout">
      <aside class="filters" aria-label="Filters">
        <div class="filters-heading">
          <h2>Filters</h2>
          <button id="reset-filters" class="text-button" type="button">Reset</button>
        </div>
        <div id="filter-controls"></div>
      </aside>

      <section class="results" aria-live="polite">
        <div class="results-heading">
          <p id="row-count">Loading results…</p>
          <p id="status" class="status"></p>
        </div>
        <div id="tables"></div>
      </section>
    </main>

    <template id="filter-group-template">
      <fieldset class="filter-group">
        <legend></legend>
        <div class="filter-options"></div>
      </fieldset>
    </template>

    <script src="../app.js?v=20260729-site-data-sync"></script>
  </body>
</html>
